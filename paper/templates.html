<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Daily Sheet — printable templates</title>
<style>
@page { size: letter landscape; margin: 0.34in; }

:root{
  --ink:#1a1a1a;
  --rule:#9a9a9a;        /* the line you write on */
  --hair:#cfcfcf;        /* column separators */
  --frame:#b4b4b4;       /* card edge */
  --faint:#8c8c8c;       /* printed labels */
}

*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#6b6b6b}
body{
  font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;
  color:var(--ink);
  -webkit-print-color-adjust:exact; print-color-adjust:exact;
}

/* ---------- one printed page ---------- */
.sheet{
  width:10.32in; height:7.82in;      /* letter landscape less 0.34in margins */
  background:#fff;
  display:flex; flex-direction:column;
  margin:0 auto 24px; padding:0;
  box-shadow:0 6px 24px rgba(0,0,0,.45);
}

/* ---------- masthead ---------- */
.top{
  display:flex; align-items:flex-end; gap:6mm;
  border-bottom:1.1pt solid var(--ink);
  padding-bottom:1.6mm; margin-bottom:2.6mm;
  flex:0 0 auto;
}
.title{ font-size:11.5pt; font-weight:700; letter-spacing:-.01em; white-space:nowrap; }
.title small{
  display:block; font-size:5.2pt; font-weight:400; letter-spacing:.16em;
  text-transform:uppercase; color:var(--faint); margin-top:.4mm;
}
.dated{ display:flex; align-items:flex-end; gap:2mm; flex:1; max-width:78mm; }
.dated .lbl{
  font-size:6pt; letter-spacing:.16em; text-transform:uppercase;
  color:var(--faint); padding-bottom:.6mm;
}
.dated .blank{ flex:1; border-bottom:.7pt solid var(--ink); height:5.4mm; }
.legend{
  margin-left:auto; display:flex; align-items:flex-end; gap:5mm;
  font-size:6.4pt; color:var(--faint); padding-bottom:.6mm;
}
.legend .item{ display:flex; align-items:center; gap:1.4mm; white-space:nowrap; }
.legend .note{ font-style:italic; }

/* ---------- the grid of cards ---------- */
.grid{ flex:1; display:grid; min-height:0; }
.g3{ grid-template-columns:repeat(3,1fr); grid-template-rows:repeat(3,1fr); gap:2.6mm; }
.g4{ grid-template-columns:repeat(4,1fr); grid-template-rows:repeat(4,1fr); gap:2.2mm; }

.card{
  border:.6pt solid var(--frame);
  border-radius:1.2mm;
  padding:1.8mm 2.2mm 1.6mm;
  display:flex; flex-direction:column; min-height:0; min-width:0;
}
.g4 .card{ padding:1.4mm 1.8mm 1.2mm; }

/* card header: a heavy rule to write the client name on */
.chead{
  display:flex; align-items:flex-end;
  border-bottom:.9pt solid var(--ink);
  padding-bottom:1.2mm; margin-bottom:1.2mm;
  flex:0 0 auto;
}
.g3 .chead{ height:7.2mm; }
.g4 .chead{ height:5.8mm; }
.cname{ flex:1; }
.cdate{
  flex:0 0 var(--datew); align-self:stretch;
  border-left:.45pt solid var(--hair);
  display:flex; align-items:flex-end; justify-content:center;
  font-size:4.8pt; letter-spacing:.14em; text-transform:uppercase; color:#a8a8a8;
}

/* ---------- the writing lines ---------- */
.lines{ flex:1; display:flex; flex-direction:column; min-height:0; }
.line{
  flex:1 1 0; min-height:0;
  display:flex; align-items:flex-end; gap:1.3mm;
  border-bottom:.45pt solid var(--rule);
  padding-bottom:.7mm;
}
.line:last-child{ border-bottom:.45pt solid var(--rule); }

.box{ border:.6pt solid var(--ink); border-radius:.3mm; flex:0 0 auto; }
.star{ flex:0 0 auto; display:block; }
.star path{ fill:none; stroke:var(--ink); stroke-width:2.1; stroke-linejoin:round; }
.write{ flex:1; min-width:0; }
.dcell{ flex:0 0 var(--datew); align-self:stretch; border-left:.45pt solid var(--hair); }

/* 3x3: roomier line spacing and slightly larger marks */
.g3{ --datew:13mm; }
.g3 .box{ width:3mm; height:3mm; }
.g3 .star{ width:3.4mm; height:3.4mm; }

/* 4x4: tighter, for smaller handwriting */
.g4{ --datew:10mm; }
.g4 .box{ width:2.5mm; height:2.5mm; }
.g4 .star{ width:2.9mm; height:2.9mm; }

.legend .box{ width:2.7mm; height:2.7mm; }
.legend .star{ width:3.1mm; height:3.1mm; }

/* ---------- screen only ---------- */
.caption{
  max-width:10.32in; margin:0 auto 6px; color:#f2f2f2;
  font-size:12px; letter-spacing:.14em; text-transform:uppercase;
}
.pad{ height:22px; }

@media print{
  html,body{ background:#fff; }
  .sheet{ margin:0; box-shadow:none; break-after:page; page-break-after:always; }
  .sheet:last-of-type{ break-after:auto; page-break-after:auto; }
  .caption,.pad{ display:none; }
}
</style>
</head>
<body>
<div class="pad"></div>
<div class="caption">Page 1 — nine cards</div>
<div class="sheet" id="p3"></div>

<div class="caption">Page 2 — sixteen cards</div>
<div class="sheet" id="p4"></div>
<div class="pad"></div>

<script>
var STAR = '<svg class="star" viewBox="0 0 24 24" aria-hidden="true">' +
  '<path d="M12 2.7 14.85 8.9 21.5 9.7 16.6 14.35 17.9 21 12 17.7 6.1 21 7.4 14.35 2.5 9.7 9.15 8.9z"/></svg>';

function head(){
  return '<div class="top">' +
    '<div class="title">Daily Sheet<small>Bare Consulting</small></div>' +
    '<div class="dated"><span class="lbl">Dates</span><span class="blank"></span></div>' +
    '<div class="legend">' +
      '<span class="item"><span class="box"></span>done</span>' +
      '<span class="item">' + STAR + 'priority</span>' +
      '<span class="note">right column&nbsp;&mdash;&nbsp;due, or the day you took it on</span>' +
    '</div>' +
  '</div>';
}

function card(lines){
  var rows = "";
  for (var i = 0; i < lines; i++){
    rows += '<div class="line">' +
      '<span class="box"></span>' + STAR +
      '<span class="write"></span>' +
      '<span class="dcell"></span>' +
    '</div>';
  }
  return '<div class="card">' +
    '<div class="chead"><span class="cname"></span><span class="cdate">date</span></div>' +
    '<div class="lines">' + rows + '</div>' +
  '</div>';
}

function page(el, cols, cards, lines){
  var grid = "";
  for (var i = 0; i < cards; i++) grid += card(lines);
  el.innerHTML = head() + '<div class="grid g' + cols + '">' + grid + '</div>';
}

page(document.getElementById("p3"), 3, 9, 7);
page(document.getElementById("p4"), 4, 16, 6);
</script>
</body>
</html>
