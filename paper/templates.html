<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Daily Sheet — printable templates</title>
<style>
@page { size: letter landscape; margin: 0.34in; }

:root{
  --ink:#111111;
  --label:#3d3d3d;      /* printed words: DATE, DATES, legend */
  --faint:#5f5f5f;      /* secondary printed words */
  --rule:#767676;       /* the line you write on */
  --hair:#a8a8a8;       /* the date-column separator */
  --frame:#8f8f8f;      /* card edge */
}

*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#6b6b6b}
body{
  font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;
  color:var(--ink);
  -webkit-print-color-adjust:exact; print-color-adjust:exact;
}

/* ---------- one printed page ---------- */
.sheet{
  width:10.32in; height:7.82in;      /* letter landscape less 0.34in margins */
  background:#fff;
  display:flex; flex-direction:column;
  margin:0 auto 26px; padding:0;
  box-shadow:0 6px 24px rgba(0,0,0,.45);
}

/* ---------- masthead ---------- */
.top{
  display:flex; align-items:flex-end; gap:6mm;
  border-bottom:1.3pt solid var(--ink);
  padding-bottom:1.6mm; margin-bottom:2.6mm;
  flex:0 0 auto;
}
.title{ font-size:11.5pt; font-weight:700; letter-spacing:-.01em; white-space:nowrap; }
.title .count{ font-weight:500; color:var(--label); }
.title small{
  display:block; font-size:5.4pt; font-weight:500; letter-spacing:.16em;
  text-transform:uppercase; color:var(--faint); margin-top:.4mm;
}
.dated{ display:flex; align-items:flex-end; gap:2mm; flex:1; max-width:78mm; }
.dated .lbl{
  font-size:6.4pt; font-weight:600; letter-spacing:.16em; text-transform:uppercase;
  color:var(--label); padding-bottom:.6mm;
}
.dated .blank{ flex:1; border-bottom:1pt solid var(--ink); height:5.4mm; }
.legend{
  margin-left:auto; display:flex; align-items:flex-end; gap:5mm;
  font-size:6.6pt; color:var(--label); padding-bottom:.6mm;
}
.legend .item{ display:flex; align-items:center; gap:1.4mm; white-space:nowrap; }
.legend .note{ font-style:italic; color:var(--faint); }

/* ---------- the grid of cards ---------- */
.grid{ flex:1; display:grid; min-height:0; }
.grid.c3{ grid-template-columns:repeat(3,1fr); gap:2.6mm; --datew:13mm; }
.grid.c4{ grid-template-columns:repeat(4,1fr); gap:2.2mm; --datew:10mm; }
.grid.r3{ grid-template-rows:repeat(3,1fr); }
.grid.r4{ grid-template-rows:repeat(4,1fr); }
.grid.flowcol{ grid-auto-flow:column; }

.card{
  border:.8pt solid var(--frame);
  border-radius:1.2mm;
  padding:1.8mm 2.2mm 1.6mm;
  display:flex; flex-direction:column; min-height:0; min-width:0;
}
.grid.c4 .card{ padding:1.4mm 1.8mm 1.2mm; }
.card.tall{ grid-row:span 2; }

/* card header: a heavy rule to write the client name on */
.chead{
  display:flex; align-items:flex-end;
  border-bottom:1.2pt solid var(--ink);
  padding-bottom:1.2mm; margin-bottom:1.2mm;
  flex:0 0 auto;
}
.grid.r3 .chead{ height:7.2mm; }
.grid.r4 .chead{ height:5.8mm; }
.cname{ flex:1; }
.cdate{
  flex:0 0 var(--datew); align-self:stretch;
  border-left:.55pt solid var(--hair);
  display:flex; align-items:flex-end; justify-content:center;
  font-size:5.6pt; font-weight:600; letter-spacing:.12em;
  text-transform:uppercase; color:var(--label);
}

/* ---------- the writing lines ---------- */
.lines{ flex:1; display:flex; flex-direction:column; min-height:0; }
.line{
  flex:1 1 0; min-height:0;
  display:flex; align-items:flex-end; gap:1.3mm;
  border-bottom:.6pt solid var(--rule);
  padding-bottom:.7mm;
}
.box{ border:.8pt solid var(--ink); border-radius:.3mm; flex:0 0 auto; }
.star{ flex:0 0 auto; display:block; }
.star path{ fill:none; stroke:var(--ink); stroke-width:2.5; stroke-linejoin:round; }
.write{ flex:1; min-width:0; }
.dcell{ flex:0 0 var(--datew); align-self:stretch; border-left:.55pt solid var(--hair); }

.grid.c3 .box{ width:3mm; height:3mm; }
.grid.c3 .star{ width:3.4mm; height:3.4mm; }
.grid.c4 .box{ width:2.5mm; height:2.5mm; }
.grid.c4 .star{ width:2.9mm; height:2.9mm; }

.legend .box{ width:2.7mm; height:2.7mm; }
.legend .star{ width:3.1mm; height:3.1mm; }

/* ---------- screen only ---------- */
.pad{ height:22px; }

@media print{
  html,body{ background:#fff; }
  .sheet{ margin:0; box-shadow:none; break-after:page; page-break-after:always; }
  .sheet:last-of-type{ break-after:auto; page-break-after:auto; }
  .pad{ display:none; }
}
</style>
</head>
<body>
<div class="pad"></div>
<div id="out"></div>
<div class="pad"></div>

<script>
var STAR = '<svg class="star" viewBox="0 0 24 24" aria-hidden="true">' +
  '<path d="M12 2.7 14.85 8.9 21.5 9.7 16.6 14.35 17.9 21 12 17.7 6.1 21 7.4 14.35 2.5 9.7 9.15 8.9z"/></svg>';

/* Each page: how the grid is shaped, and the runs of cards that fill it.
   A run is a count, a number of writing lines, and whether the card is
   double height. */
var PAGES = [
  { label:"9",              grid:"c3 r3",         runs:[ {n:9,  lines:7} ] },
  { label:"16",             grid:"c4 r4",         runs:[ {n:16, lines:6} ] },
  { label:"12 &middot; 4&times;3", grid:"c4 r3",  runs:[ {n:12, lines:8} ] },
  { label:"12 &middot; 3&times;4", grid:"c3 r4",  runs:[ {n:12, lines:6} ] },
  { label:"14",             grid:"c4 r4 flowcol", runs:[ {n:12, lines:6},
                                                         {n:2,  lines:14, tall:true} ] }
];

function head(label){
  return '<div class="top">' +
    '<div class="title">Daily Sheet <span class="count">(' + label + ')</span>' +
      '<small>Bare Consulting</small></div>' +
    '<div class="dated"><span class="lbl">Dates</span><span class="blank"></span></div>' +
    '<div class="legend">' +
      '<span class="item"><span class="box"></span>done</span>' +
      '<span class="item">' + STAR + 'priority</span>' +
      '<span class="note">right column&nbsp;&mdash;&nbsp;due, or the day you took it on</span>' +
    '</div>' +
  '</div>';
}

function card(lines, tall){
  var rows = "";
  for (var i = 0; i < lines; i++){
    rows += '<div class="line">' +
      '<span class="box"></span>' + STAR +
      '<span class="write"></span>' +
      '<span class="dcell"></span>' +
    '</div>';
  }
  return '<div class="card' + (tall ? " tall" : "") + '">' +
    '<div class="chead"><span class="cname"></span><span class="cdate">date</span></div>' +
    '<div class="lines">' + rows + '</div>' +
  '</div>';
}

document.getElementById("out").innerHTML = PAGES.map(function(pg){
  var cards = pg.runs.map(function(run){
    var out = "";
    for (var i = 0; i < run.n; i++) out += card(run.lines, run.tall);
    return out;
  }).join("");
  return '<div class="sheet">' + head(pg.label) +
    '<div class="grid ' + pg.grid + '">' + cards + '</div></div>';
}).join("");
</script>
</body>
</html>
