<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<style>
  :root {
    color-scheme: dark;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  body { margin: 0; font: 14px system-ui, sans-serif; background: #001A28; }
  img { max-width: 100%; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<title>Daily Sheet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@600;700&family=Public+Sans:wght@400;500;600&display=swap">
<style>
:root{
  /* Deep UCLA navy ground, warm gold type. Every pairing below clears
     7:1 against the surface behind it; body text clears 11:1. */
  color-scheme:dark;
  --paper:#001A28;      /* page ground, behind the sheet */
  --sheet:#00304A;      /* the sheet itself */
  --sheet-2:#0A3E5C;    /* hover, inset fields, menus */
  --ink:#F2E6C4;        /* body text: pale gold, 11.1:1 on the sheet */
  --ink-2:#C8B98E;      /* secondary gold, 7.1:1 */
  --ink-3:#8FA3B4;      /* faint, cool, recedes: placeholders and counts */
  --rule:#14506F;
  --rule-2:#0C3E58;
  --accent:#FFC72C;     /* UCLA gold: structure, focus, emphasis, 8.9:1 */
  --accent-soft:#12455F;
  --prio:#4DD0E1;       /* on today's list: the one non-UCLA hue, 7.5:1 */
  --warn:#FFB86B;       /* ageing */
  --warn-soft:#3A2A14;
  --alert:#FF8A80;      /* a week stale */
  --alert-soft:#42201E;
  --done:#5FD79B;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 14px 36px -18px rgba(0,0,0,.8);
  --radius:10px;
  --wrap:820px;
  --font-body:'Public Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --font-display:'Plus Jakarta Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
}

*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:var(--font-body); font-size:15px; line-height:1.5;
  -webkit-text-size-adjust:100%;
}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}

.wrap{max-width:var(--wrap);margin:0 auto;padding-inline:16px;padding-block:0 96px}
@media (min-width:780px){:root{--wrap:1120px}}
@media (min-width:1150px){:root{--wrap:1480px}}

/* ---------- masthead ---------- */
.masthead{
  position:sticky; top:env(safe-area-inset-top,0px); z-index:30;
  background:var(--paper); border-bottom:1px solid var(--rule);
}
.masthead-in{
  max-width:var(--wrap);margin:0 auto;padding-inline:16px;padding-block:14px 10px;
  display:flex;flex-wrap:wrap;gap:10px 16px;align-items:flex-end;justify-content:space-between;
}
.dateblock{min-width:0}
.dateline{
  color:var(--accent);
  font-family:var(--font-display);font-weight:700;font-size:23px;line-height:1.15;
  letter-spacing:-.025em;text-wrap:balance;margin:0;
}
.tally{
  font-family:var(--font-mono);font-size:11.5px;letter-spacing:.02em;
  color:var(--ink-2);margin-top:5px;display:flex;flex-wrap:wrap;gap:4px 10px;
}
.tally b{font-weight:500;color:var(--ink)}
.tally .warn{color:var(--alert)}
.tally .hot b,.tally .hot{color:var(--accent)}
.tools{display:flex;align-items:center;gap:6px;flex-shrink:0}
.tabs{display:flex;background:var(--paper);border:1px solid var(--rule);border-radius:9px;padding:2px}
.tab{
  font-size:12.5px;font-weight:500;padding:5px 13px;border-radius:7px;
  color:var(--ink-2);white-space:nowrap;
}
.tab[aria-selected="true"]{background:var(--sheet-2);color:var(--accent);box-shadow:none}
.iconbtn{
  width:31px;height:31px;display:grid;place-items:center;border-radius:6px;
  color:var(--ink-2);border:1px solid transparent;
}
.iconbtn:hover{background:var(--sheet-2);color:var(--ink);border-color:var(--rule)}
.iconbtn svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}

/* ---------- the sheet ---------- */
/* One column on a phone; two, then three as the window widens, the way the
   paper sheet runs across a landscape page. The columns are real elements
   rather than CSS multicol, so a menu is never fragmented across one. */
.sheet{margin-top:18px;display:flex;align-items:flex-start;gap:16px}
.col{flex:1 1 0;min-width:0;display:flex;flex-direction:column;gap:16px}
.section{
  background:var(--sheet);border:1px solid var(--rule);
  border-radius:var(--radius);box-shadow:var(--shadow);
}
.sechead{
  display:flex;align-items:center;gap:9px;
  padding:14px 14px 8px 14px;position:relative;
}
.dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.secname{
  font-family:var(--font-mono);font-size:11.5px;font-weight:500;
  letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2);
  min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.seccount{font-family:var(--font-mono);font-size:11px;color:var(--ink-3);margin-left:auto;flex-shrink:0}
.secedit{
  font-family:var(--font-mono);font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;
  background:var(--sheet-2);border:1px solid var(--accent);border-radius:4px;
  padding:3px 7px;width:100%;max-width:340px;
}

/* margin rule, like a legal pad */
.rows{position:relative}
.rows::before{
  content:"";position:absolute;left:38px;top:0;bottom:0;width:1px;
  background:var(--rule);
}
.row{
  display:flex;align-items:flex-start;gap:0;position:relative;
  min-height:34px;
}
.row:hover{background:var(--sheet-2)}
.row.dragging{opacity:.4}
.row.dropbefore{box-shadow:inset 0 2px 0 -1px var(--accent)}
.row.dropafter{box-shadow:inset 0 -2px 0 -1px var(--accent)}
.box{
  width:38px;flex-shrink:0;display:flex;justify-content:center;
  padding-top:8px;align-self:stretch;
}
.box button{
  width:17px;height:17px;border:1.6px solid var(--ink-3);border-radius:2.5px;
  display:grid;place-items:center;transition:border-color .12s,background .12s;
}
.box button:hover{border-color:var(--done);background:color-mix(in srgb,var(--done) 12%,transparent)}
.box button svg{width:12px;height:12px;fill:none;stroke:var(--done);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;opacity:0}
.row.done .box button{border-color:var(--done);background:color-mix(in srgb,var(--done) 14%,transparent)}
.row.done .box button svg{opacity:1;animation:tick .18s ease-out}
@keyframes tick{from{transform:scale(.5);opacity:0}to{transform:scale(1);opacity:1}}
@media (prefers-reduced-motion:reduce){.row.done .box button svg{animation:none}}

.text{
  flex:1;min-width:0;padding:7px 4px 7px 10px;
  word-break:break-word;cursor:text;
}
.row.done .text{color:var(--ink-3);text-decoration:line-through;text-decoration-color:var(--ink-3)}
.textedit{
  flex:1;min-width:0;margin:4px 4px 4px 8px;padding:3px 7px;
  background:var(--sheet-2);border:1px solid var(--accent);border-radius:4px;
}
.meta{display:flex;align-items:center;gap:2px;padding:6px 8px 6px 0;flex-shrink:0}
.age{
  font-family:var(--font-mono);font-size:10.5px;font-weight:500;
  padding:2px 5px;border-radius:3px;white-space:nowrap;
  background:var(--sheet-2);color:var(--ink-3);border:1px solid var(--rule-2);
}
.age.warm{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.age.hot{background:var(--alert-soft);color:var(--alert);border-color:transparent}
.dots{
  width:24px;height:24px;display:grid;place-items:center;border-radius:5px;
  color:var(--ink-3);opacity:0;
}
.row:hover .dots,.dots:focus-visible,.dots.open{opacity:1}
@media (hover:none){.dots{opacity:1}}
.dots:hover{background:var(--rule-2);color:var(--ink)}
.dots svg{width:15px;height:15px;fill:currentColor}
.grip{
  width:0;overflow:hidden;
}
@media (hover:hover){
  .grip{width:14px;flex-shrink:0;display:flex;align-items:center;justify-content:center;
    color:var(--ink-3);opacity:0;cursor:grab;padding-top:2px}
  .row:hover .grip{opacity:.65}
  .grip svg{width:10px;height:14px;fill:currentColor}
}

/* add line */
.addline{display:flex;align-items:center;padding-bottom:12px}
.addplus{
  width:38px;flex-shrink:0;display:grid;place-items:center;color:var(--ink-3);
  font-family:var(--font-mono);font-size:15px;line-height:1;
}
.addline input{
  flex:1;min-width:0;background:none;border:0;padding:6px 10px 6px 10px;
  border-bottom:1px dashed transparent;
}
.addline input::placeholder{color:var(--ink-3)}
.addline input:focus{outline:none;border-bottom-color:var(--accent)}

/* Two independent marks. Today is cyan, priority is gold, and a line may
   carry either, both, or neither; carrying both gives it a split rail. */
.row.today{background:color-mix(in srgb,var(--prio) 9%,transparent)}
.row.today:hover{background:color-mix(in srgb,var(--prio) 15%,transparent)}
.row.today::before,.row.hi::before{
  content:"";position:absolute;left:0;top:0;bottom:0;width:3px;
  background:var(--prio);
}
.row.today .box button{border-color:var(--prio);border-width:2px}
.row.today.late::before{background:var(--warn)}
.row.today.overdue::before{background:var(--alert)}
.row.today.late .box button{border-color:var(--warn)}
.row.today.overdue .box button{border-color:var(--alert)}

.row.hi{background:color-mix(in srgb,var(--accent) 12%,transparent)}
.row.hi:hover{background:color-mix(in srgb,var(--accent) 18%,transparent)}
.row.hi::before{background:var(--accent);width:4px}
.row.hi .box button{border-color:var(--accent);border-width:2px}
.row.hi .text{font-weight:600}
.row.hi.today::before{
  width:4px;
  background:linear-gradient(to bottom,var(--accent) 0 50%,var(--prio) 50% 100%);
}

/* inside Today every line is already on today's list, so that rail says
   nothing there - an overdue or high-priority one still does */
.sheet.focus .row.today:not(.late):not(.overdue):not(.hi){background:transparent}
.sheet.focus .row.today:not(.late):not(.overdue):not(.hi):hover{background:var(--sheet-2)}
.sheet.focus .row.today:not(.late):not(.overdue):not(.hi)::before{display:none}

.markbtn{
  width:22px;height:22px;display:grid;place-items:center;border-radius:5px;
  color:var(--ink-3);opacity:0;flex-shrink:0;
}
.row:hover .markbtn{opacity:.75}
.markbtn.on{opacity:1;color:var(--prio)}
.markbtn.on.late{color:var(--warn)}
.markbtn.on.overdue{color:var(--alert)}
.markbtn.star.on{color:var(--accent)}
.markbtn:hover{background:var(--rule-2);opacity:1}
@media (hover:none){.markbtn{opacity:.5}}
.markbtn svg{width:13px;height:13px}

/* line kinds: notes carry no checkbox, sub-lines sit indented */
.row.note .box{visibility:hidden}
.row.note .text{color:var(--ink-2);font-size:13.5px}
.row.ind .box{margin-left:24px}
.row.wip .box button{border-color:var(--ink-2)}
.row.wip .box button::after{
  content:"";width:11px;height:1.8px;border-radius:2px;
  background:var(--ink-2);transform:rotate(-45deg);
}
.chip{
  font-family:var(--font-mono);font-size:10px;letter-spacing:.03em;
  padding:2px 6px;border-radius:3px;white-space:nowrap;
  background:var(--accent-soft);color:var(--ink-2);
}
.chip.waiting{background:var(--warn-soft);color:var(--warn)}
.sectoggle{
  width:15px;height:15px;display:grid;place-items:center;
  color:var(--ink-3);flex-shrink:0;margin-left:-3px;
}
.sectoggle svg{width:9px;height:9px;fill:currentColor;transition:transform .13s}
.section.closed .sectoggle svg{transform:rotate(-90deg)}
@media (prefers-reduced-motion:reduce){.sectoggle svg{transition:none}}
.section.closed .sechead{padding-bottom:14px}

/* menus */
.menu{
  position:absolute;right:8px;top:calc(100% - 4px);z-index:20;
  background:var(--sheet-2);border:1px solid var(--rule);border-radius:9px;
  box-shadow:var(--shadow);padding:5px;min-width:186px;
}
.menu button{
  display:flex;width:100%;align-items:center;gap:8px;
  padding:6px 9px;border-radius:5px;font-size:13px;text-align:left;color:var(--ink);
}
.menu button:hover{background:var(--sheet-2)}
.menu button.danger{color:var(--alert)}
.menu .sep{height:1px;background:var(--rule-2);margin:4px 2px}
.menu .lbl{
  font-family:var(--font-mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--ink-3);padding:6px 9px 3px;
}
.menu .swatch{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.menuwrap{position:relative}

/* done cluster */
.donehead{
  font-family:var(--font-mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--ink-3);padding:10px 14px 2px 38px;
}
.undo{
  width:24px;height:24px;display:grid;place-items:center;border-radius:5px;color:var(--ink-3);opacity:0;
}
.row:hover .undo{opacity:1}
@media (hover:none){.undo{opacity:.7}}
.undo:hover{background:var(--rule-2);color:var(--ink)}
.undo svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* footers / misc */
.addsec{
  display:flex;align-items:center;gap:8px;padding:12px 14px;width:100%;
  color:var(--ink-3);font-size:13px;border:1px dashed var(--rule);
  border-radius:var(--radius);margin-top:16px;
}
.addsec:hover{background:var(--sheet);color:var(--ink)}
.empty{padding:20px 14px 20px 38px;color:var(--ink-3);font-size:13.5px;font-style:italic}

.strays{border-style:dashed;border-color:var(--accent);box-shadow:none}
.strayhead{
  font-family:var(--font-mono);font-size:10px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--accent);padding:13px 14px 4px;
}

/* log view */
.logday{margin-top:18px;background:var(--sheet);border:1px solid var(--rule);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
.logdate{
  display:flex;align-items:baseline;gap:10px;padding:12px 14px;border-bottom:1px solid var(--rule-2);
}
.logdate h3{margin:0;font-family:var(--font-display);font-size:16px;font-weight:700;letter-spacing:-.02em}
.logdate .n{font-family:var(--font-mono);font-size:11px;color:var(--ink-3);margin-left:auto}
.loggroup{padding:9px 14px 9px 14px;border-bottom:1px solid var(--rule-2)}
.loggroup:last-child{border-bottom:0}
.loggroup .g{
  display:flex;align-items:center;gap:7px;
  font-family:var(--font-mono);font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);
  margin-bottom:4px;
}
.logitem{display:flex;gap:9px;align-items:baseline;padding:2px 0;font-size:14px}
.logitem .ck{color:var(--done);font-family:var(--font-mono);font-size:12px;flex-shrink:0}
.logitem .carried{font-family:var(--font-mono);font-size:10.5px;color:var(--ink-3);margin-left:auto;flex-shrink:0;padding-left:8px}
.blank{
  text-align:center;color:var(--ink-3);font-style:italic;font-size:14px;
  padding:44px 16px;border:1px dashed var(--rule);border-radius:var(--radius);margin-top:18px;
}

/* settings / copy panel */
.panel{
  margin-top:18px;background:var(--sheet);border:1px solid var(--rule);
  border-radius:var(--radius);box-shadow:var(--shadow);padding:16px 14px;
}
.panel h2{
  margin:0 0 12px;font-family:var(--font-mono);font-size:11px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--ink-3);font-weight:500;
}
.field{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;justify-content:space-between;padding:8px 0;border-top:1px solid var(--rule-2)}
.field:first-of-type{border-top:0}
.field .k{font-size:14px}
.field .h{font-size:12px;color:var(--ink-3);width:100%;margin-top:-2px}
.field select,.field .val{
  font-family:var(--font-mono);font-size:12.5px;padding:4px 8px;
  background:var(--sheet-2);border:1px solid var(--rule);border-radius:5px;color:var(--ink);
}
.btn{
  font-size:13px;font-weight:500;padding:6px 12px;border-radius:6px;
  border:1px solid var(--rule);background:var(--sheet-2);color:var(--ink);
}
.btn:hover{border-color:var(--ink-3)}
.hint{font-size:12.5px;color:var(--ink-2);margin:0 0 8px;line-height:1.55}
.hint code{font-family:var(--font-mono);font-size:11.5px;background:var(--sheet-2);
  border:1px solid var(--rule-2);border-radius:3px;padding:1px 4px}
.hint.caution{color:var(--alert)}
.prow{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.review{margin-top:12px;border-top:1px solid var(--rule-2)}
.revsec{
  font-family:var(--font-mono);font-size:10.5px;letter-spacing:.09em;
  text-transform:uppercase;color:var(--ink-2);padding:11px 0 3px;
}
.revrow{display:flex;gap:8px;align-items:baseline;padding:3px 0;font-size:14px}
.revrow .marks{
  font-size:12px;flex-shrink:0;width:32px;letter-spacing:1px;
  font-family:var(--font-mono);
}
.revrow .marks .s{color:var(--accent)}
.revrow .marks .d{color:var(--prio)}
.revrow .st{
  margin-left:auto;flex-shrink:0;padding-left:8px;
  font-family:var(--font-mono);font-size:10.5px;color:var(--ink-3);
}
.thinking{
  display:flex;align-items:center;gap:9px;padding:14px 0 4px;
  color:var(--ink-2);font-size:13.5px;
}
.spinner{
  width:13px;height:13px;border:2px solid var(--rule);border-top-color:var(--accent);
  border-radius:50%;animation:spin .7s linear infinite;flex-shrink:0;
}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spinner{animation-duration:2.4s}}
.copybox{width:100%;min-height:210px;margin-top:10px;font-family:var(--font-mono);font-size:12px;
  background:var(--sheet-2);border:1px solid var(--rule);border-radius:5px;padding:9px;color:var(--ink);resize:vertical}
.toast{
  position:fixed;left:50%;transform:translateX(-50%);
  bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:60;
  background:var(--ink);color:var(--sheet);font-size:13px;
  padding:8px 15px;border-radius:99px;box-shadow:var(--shadow);
}

@media (max-width:460px){
  .row.ind .box{margin-left:18px}
  .dateline{font-size:19px}
  .masthead-in{padding-block:11px 9px}
  .tab{padding:5px 10px}
  .rows::before{left:34px}
  .box,.addplus{width:34px}
  .donehead{padding-left:34px}
}

@media print{
  :root{--paper:#fff;--sheet:#fff;--sheet-2:#fff;--ink:#000;--ink-2:#333;--ink-3:#666;
    --rule:#bbb;--rule-2:#ddd;--accent:#000;--accent-soft:#eee;--prio:#000;
    --warn:#555;--warn-soft:#eee;--alert:#000;--alert-soft:#eee;--done:#000;--shadow:none}
  .masthead{position:static;border-bottom:1px solid #000}
  .tools,.dots,.grip,.addline,.addsec,.iconbtn,.panel,.menu,.undo{display:none !important}
  .sheet,.logday{box-shadow:none;border-color:#999;break-inside:auto}
  .section{break-inside:avoid}
  body{background:#fff}
}
</style>

<div class="masthead">
  <div class="masthead-in">
    <div class="dateblock">
      <h1 class="dateline" id="dateline">Daily Sheet</h1>
      <div class="tally" id="tally"></div>
    </div>
    <div class="tools">
      <div class="tabs" role="tablist">
        <button class="tab" role="tab" id="tab-all" data-act="view" data-view="all" aria-selected="true">All</button>
        <button class="tab" role="tab" id="tab-today" data-act="view" data-view="today" aria-selected="false">Today</button>
        <button class="tab" role="tab" id="tab-log" data-act="view" data-view="log" aria-selected="false">Log</button>
      </div>
      <button class="iconbtn" id="btn-dictate" data-act="dictate" title="Dictate a list" aria-label="Dictate a list" hidden><svg viewBox="0 0 24 24"><rect x="9" y="2.5" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0"/><path d="M12 17.5V21"/></svg></button>
      <button class="iconbtn" id="btn-copy" data-act="copy" title="Copy today as text" aria-label="Copy today as text"><svg viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h8"/></svg></button>
      <button class="iconbtn" id="btn-print" data-act="print" title="Print this sheet" aria-label="Print this sheet"><svg viewBox="0 0 24 24"><path d="M6 9V3h12v6"/><rect x="4" y="9" width="16" height="7" rx="2"/><path d="M8 14h8v7H8z"/></svg></button>
      <button class="iconbtn" id="btn-settings" data-act="settings" title="Settings" aria-label="Settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-2.7 1.1V21a2 2 0 1 1-4 0v-.1A1.6 1.6 0 0 0 7.5 19l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.6 1.6 0 0 0-1.1-2.7H3a2 2 0 1 1 0-4h.1A1.6 1.6 0 0 0 4.6 7.5l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.6 1.6 0 0 0 2.7-1.1V3a2 2 0 1 1 4 0v.1a1.6 1.6 0 0 0 2.7 1.1l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.6 1.6 0 0 0 1.1 2.7H21a2 2 0 1 1 0 4h-.1a1.6 1.6 0 0 0-1.5 1.3z"/></svg></button>
    </div>
  </div>
</div>

<div class="wrap">
  <div id="main"></div>
</div>

<script>
(function(){
  "use strict";

  /* ============================ helpers ============================ */
  var STORE_KEY = "daily-sheet-v1";
  var PALETTE = ["#8BB8E8","#4DD0E1","#FFB86B","#B39DFF","#FF9EB1","#6FD79B","#A8BDCE","#E0C36B"];
  var ICON = {
    check:'<svg viewBox="0 0 24 24"><path d="M4 12.5 9.5 18 20 6.5"/></svg>',
    dots :'<svg viewBox="0 0 24 24"><circle cx="12" cy="5.5" r="1.7"/><circle cx="12" cy="12" r="1.7"/><circle cx="12" cy="18.5" r="1.7"/></svg>',
    grip :'<svg viewBox="0 0 10 14"><circle cx="2" cy="2" r="1.3"/><circle cx="8" cy="2" r="1.3"/><circle cx="2" cy="7" r="1.3"/><circle cx="8" cy="7" r="1.3"/><circle cx="2" cy="12" r="1.3"/><circle cx="8" cy="12" r="1.3"/></svg>',
    flagOn :'<svg viewBox="0 0 12 12"><path d="M3 1.4 10.2 6 3 10.6z" fill="currentColor"/></svg>',
    flagOff:'<svg viewBox="0 0 12 12"><path d="M3 1.4 10.2 6 3 10.6z" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></svg>',
    starOn :'<svg viewBox="0 0 14 14"><path d="M7 1.1 8.8 5 13 5.5l-3.1 2.9.8 4.2L7 10.6 3.3 12.6l.8-4.2L1 5.5 5.2 5z" fill="currentColor"/></svg>',
    starOff:'<svg viewBox="0 0 14 14"><path d="M7 1.1 8.8 5 13 5.5l-3.1 2.9.8 4.2L7 10.6 3.3 12.6l.8-4.2L1 5.5 5.2 5z" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/></svg>',
    caret:'<svg viewBox="0 0 10 10"><path d="M1 3h8L5 8z"/></svg>',
    undo :'<svg viewBox="0 0 24 24"><path d="M3 10h11a5 5 0 0 1 0 10h-3"/><path d="M7 6 3 10l4 4"/></svg>'
  };

  function esc(s){
    return String(s == null ? "" : s)
      .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
      .replace(/"/g,"&quot;").replace(/'/g,"&#39;");
  }
  function uid(){
    return Math.random().toString(36).slice(2,9) + Date.now().toString(36).slice(-4);
  }
  function pad(n){ return n < 10 ? "0" + n : "" + n; }

  /* Snapshots from the shared store are frozen; we edit state in place,
     so every document is cloned on the way in. */
  function clone(o){
    try { return JSON.parse(JSON.stringify(o)); } catch(e){ return o; }
  }

  /* Day boundary respects a configurable start hour, so work past
     midnight still belongs to the day it felt like. */
  function dayKey(ts, startHour){
    var d = new Date(ts);
    d.setHours(d.getHours() - (startHour || 0));
    return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
  }
  function keyToDate(k){
    var p = String(k).split("-");
    return new Date(+p[0], +p[1] - 1, +p[2]);
  }
  function daysBetween(a, b){
    return Math.round((keyToDate(b) - keyToDate(a)) / 86400000);
  }
  function fmtLong(k){
    return keyToDate(k).toLocaleDateString(undefined,{weekday:"long", month:"long", day:"numeric"});
  }
  function fmtShort(k){
    return keyToDate(k).toLocaleDateString(undefined,{month:"short", day:"numeric"});
  }
  function plural(n, one, many){ return n + " " + (n === 1 ? one : many); }

  /* One typed line -> one sheet line. The prefixes mirror the marks already
     made on paper: a dash for a note that carries no box, a slash for
     something under way, an x for something already finished, and leading
     whitespace for a sub-line. */
  function parseLine(raw){
    var indent = /^(\s\s|\t)/.test(raw) ? 1 : 0;
    var text = String(raw).replace(/^\s+/, "");
    var kind = "task", status = "", done = false, flag = false;
    var hi = false;
    var marks = text.match(/^[!*]+\s*/);
    if (marks){
      flag = marks[0].indexOf("!") >= 0;
      hi = marks[0].indexOf("*") >= 0;
      text = text.slice(marks[0].length);
    }
    var m = text.match(/^([-\u2013\u2014\/x\u00d7\u2713])\s+/i);
    if (m){
      var c = m[1].toLowerCase();
      if (c === "-" || c === "\u2013" || c === "\u2014") kind = "note";
      else if (c === "/") status = "wip";
      else done = true;
      text = text.slice(m[0].length);
    }
    return { text: text.trim(), kind: kind, status: status,
             indent: indent, done: done, flag: flag, hi: hi };
  }

  /* ============================ storage ============================ */
  /* Two backends behind one interface: the artifact's shared store when
     the page runs inside claude.ai, otherwise this browser only. Open
     tasks and sections live in ONE document (they are small, bounded,
     and always read together); each finished day is its own document,
     which keeps the archive from outgrowing the document budget. */

  function makeWriter(write){
    var pending = null, timer = null, busy = false;
    function flush(){
      if (busy || pending === null) return;
      var body = pending; pending = null; busy = true;
      Promise.resolve()
        .then(function(){ return write(body); })
        .catch(function(e){ showToast("Could not save — " + (e && e.message ? e.message : "try again")); })
        .then(function(){ busy = false; if (pending !== null) flush(); });
    }
    return function(body){
      pending = body;
      clearTimeout(timer);
      timer = setTimeout(flush, 220);
    };
  }

  function localStore(){
    function read(){
      try { return JSON.parse(localStorage.getItem(STORE_KEY) || "{}") || {}; }
      catch(e){ return {}; }
    }
    function write(o){
      try { localStorage.setItem(STORE_KEY, JSON.stringify(o)); } catch(e){}
    }
    return {
      kind: "local",
      watchBoard: function(cb){
        setTimeout(function(){ cb(read().board || null); }, 0);
        return function(){};
      },
      saveBoard: function(b){ var o = read(); o.board = b; write(o); },
      watchDay: function(k, cb){
        setTimeout(function(){ cb((read().days || {})[k] || null); }, 0);
        return function(){};
      },
      saveDay: function(k, d){ var o = read(); o.days = o.days || {}; o.days[k] = d; write(o); },
      listDays: function(n){
        var days = read().days || {};
        var keys = Object.keys(days).sort().reverse().slice(0, n);
        return Promise.resolve(keys.map(function(k){ return days[k]; }));
      }
    };
  }

  function cloudStore(db){
    var boardRef = db.doc("board/state");
    var writeBoard = makeWriter(function(d){ return boardRef.set(d); });
    var dayWriters = {};
    return {
      kind: "cloud",
      watchBoard: function(cb){
        return boardRef.onSnapshot(
          function(s){ cb(s.exists ? s.data() : null); },
          function(e){ showToast("Sync interrupted (" + e.code + ")"); }
        );
      },
      saveBoard: function(b){ writeBoard(b); },
      watchDay: function(k, cb){
        return db.doc("archive/" + k).onSnapshot(
          function(s){ cb(s.exists ? s.data() : null); },
          function(){}
        );
      },
      saveDay: function(k, d){
        if (!dayWriters[k]) {
          dayWriters[k] = makeWriter(function(x){ return db.doc("archive/" + k).set(x); });
        }
        dayWriters[k](d);
      },
      listDays: function(n){
        return db.collection("archive").orderBy("date","desc").limit(n).get()
          .then(function(s){ return s.docs.map(function(d){ return d.data(); }); })
          .catch(function(){ return []; });
      }
    };
  }

  /* ============================ state ============================ */
  var store = null;
  var unsubDay = null;
  var state = {
    board: null,
    today: dayKey(Date.now(), 4),
    day: null,
    logDays: null,
    view: "all",
    panel: null,        // null | "settings" | "copy"
    copyText: "",
    editing: null,      // {kind:"task"|"section", id}
    menu: null,         // {kind:"task"|"section", id}
    confirm: null,      // id pending delete confirmation
    drafts: {},         // sectionId -> in-progress text
    importText: "",     // draft in the import box
    dictText: "",       // draft in the dictation box
    dictBusy: false,
    dictResult: null,   // what Claude made of it, pending review
    dictError: "",
    sampler: null,      // the sample capability, when this view has it
    focus: null,        // element id to restore focus to
    dragId: null
  };

  function seedBoard(){
    var today = state.today;
    var names = ["CI", "a.k.a.", "Sunrun", "Broadcom", "HL", "GD", "Qualcomm", "Admin"];
    var secs = names.map(function(n, i){
      return { id: uid(), name: n, color: PALETTE[i % PALETTE.length], collapsed: false };
    });
    function t(i, text, kind, status, indent, flag, hi){
      return {
        id: uid(), sectionId: secs[i].id, text: text, created: today,
        kind: kind || "task", status: status || "", indent: indent || 0,
        flag: flag ? today : "", hi: !!hi
      };
    }
    return {
      v: 2,
      settings: { dayStart: 4 },
      sections: secs,
      tasks: [
        t(7, "Settings \u2192 Import a sheet: paste your whole list in at once",
             null, null, 0, true),
        t(7, "\u2605 and \u25B8 are independent \u2014 this line carries both",
             null, null, 0, true, true),
        t(7, "\u25B8 puts a line on today's list", null, null, 0, true),
        t(7, "\u2605 makes it high priority, on today's list or not",
             null, null, 0, false, true),
        t(7, "An unmarked line just sits here \u2014 the Today tab hides it"),
        t(7, "Start a line with / to mark it under way", null, "wip"),
        t(7, "Two leading spaces make a sub-line", null, null, 1)
      ]
    };
  }

  function commitBoard(){
    state.board.updated = Date.now();
    store.saveBoard(state.board);
    render();
  }
  function commitDay(day){
    state.day = day;
    store.saveDay(day.date, day);
    render();
  }

  /* ============================ derived ============================ */
  function tasksOf(sectionId){
    return state.board.tasks.filter(function(t){ return t.sectionId === sectionId; });
  }
  function doneOf(sectionId){
    var items = (state.day && state.day.items) || [];
    return items.filter(function(i){ return i.sectionId === sectionId; });
  }
  function ageOf(task){
    var n = daysBetween(task.created, state.today);
    return n > 0 ? n : 0;
  }
  /* A flag records the day the item was committed to, so an item still
     flagged days later can say so instead of quietly resetting. */
  function flagAge(task){
    if (!task.flag) return -1;
    var n = daysBetween(task.flag, state.today);
    return n > 0 ? n : 0;
  }
  function flagClass(task){
    var n = flagAge(task);
    if (n < 0) return "";
    return n >= 3 ? " overdue" : (n >= 1 ? " late" : "");
  }

  function counts(){
    var work = state.board.tasks.filter(function(t){ return t.kind !== "note"; });
    return {
      open: work.length,
      flagged: work.filter(function(t){ return !!t.flag; }).length,
      high: work.filter(function(t){ return !!t.hi; }).length,
      done: ((state.day && state.day.items) || []).length,
      wip: work.filter(function(t){ return t.status === "wip"; }).length,
      carried: work.filter(function(t){ return ageOf(t) > 0; }).length,
      stale: work.filter(function(t){ return ageOf(t) >= 7; }).length
    };
  }

  /* ============================ actions ============================ */
  function addTask(sectionId, raw){
    var p = parseLine(raw || "");
    if (!p.text) return;
    var idx = -1;
    for (var i = state.board.tasks.length - 1; i >= 0; i--){
      if (state.board.tasks[i].sectionId === sectionId){ idx = i; break; }
    }
    var task = {
      id: uid(), sectionId: sectionId, text: p.text, created: state.today,
      kind: p.kind, status: p.status, indent: p.indent,
      flag: p.flag ? state.today : "",
      hi: !!p.hi
    };
    state.board.tasks.splice(idx + 1, 0, task);
    state.drafts[sectionId] = "";
    state.focus = "add-" + sectionId;
    if (p.done && p.kind === "task"){ completeTask(task.id); return; }
    commitBoard();
  }

  function setField(id, field, value){
    var task = state.board.tasks.find(function(t){ return t.id === id; });
    if (!task) return;
    task[field] = value;
    if (field === "kind" && value === "note") task.status = "";
    commitBoard();
  }

  function completeTask(id){
    var i = state.board.tasks.findIndex(function(t){ return t.id === id; });
    if (i < 0) return;
    var task = state.board.tasks[i];
    var sec = state.board.sections.find(function(s){ return s.id === task.sectionId; });
    var day = state.day || { date: state.today, items: [] };
    var items = day.items.slice();
    items.unshift({
      id: task.id, text: task.text, sectionId: task.sectionId,
      sectionName: sec ? sec.name : "Unfiled",
      color: sec ? sec.color : PALETTE[4],
      created: task.created, doneAt: Date.now(), age: ageOf(task),
      flag: task.flag || "", hi: !!task.hi
    });
    state.board.tasks.splice(i, 1);
    state.board.updated = Date.now();
    store.saveBoard(state.board);
    commitDay({ date: state.today, items: items });
  }

  function reopenTask(id){
    if (!state.day) return;
    var i = state.day.items.findIndex(function(t){ return t.id === id; });
    if (i < 0) return;
    var item = state.day.items[i];
    var exists = state.board.sections.some(function(s){ return s.id === item.sectionId; });
    state.board.tasks.push({
      id: item.id,
      sectionId: exists ? item.sectionId : state.board.sections[0].id,
      text: item.text,
      created: item.created || state.today,
      kind: item.kind || "task",
      status: item.status || "",
      indent: item.indent || 0,
      flag: item.flag || "",
      hi: !!item.hi
    });
    var items = state.day.items.slice();
    items.splice(i, 1);
    state.board.updated = Date.now();
    store.saveBoard(state.board);
    commitDay({ date: state.today, items: items });
  }

  function moveTask(id, delta){
    var list = state.board.tasks;
    var i = list.findIndex(function(t){ return t.id === id; });
    if (i < 0) return;
    var sib = [];
    list.forEach(function(t, n){ if (t.sectionId === list[i].sectionId) sib.push(n); });
    var at = sib.indexOf(i);
    var to = sib[at + delta];
    if (to === undefined) return;
    var tmp = list[i]; list[i] = list[to]; list[to] = tmp;
    commitBoard();
  }

  function reorderTask(dragId, targetId, after){
    var list = state.board.tasks;
    var from = list.findIndex(function(t){ return t.id === dragId; });
    if (from < 0 || dragId === targetId) return;
    var moved = list.splice(from, 1)[0];
    var to = list.findIndex(function(t){ return t.id === targetId; });
    if (to < 0){ list.splice(from, 0, moved); return; }
    moved.sectionId = list[to].sectionId;
    list.splice(after ? to + 1 : to, 0, moved);
    commitBoard();
  }

  function retargetTask(id, sectionId){
    var list = state.board.tasks;
    var i = list.findIndex(function(t){ return t.id === id; });
    if (i < 0) return;
    var task = list.splice(i, 1)[0];
    task.sectionId = sectionId;
    var last = -1;
    for (var n = list.length - 1; n >= 0; n--){
      if (list[n].sectionId === sectionId){ last = n; break; }
    }
    list.splice(last + 1, 0, task);
    commitBoard();
  }

  function deleteTask(id){
    state.board.tasks = state.board.tasks.filter(function(t){ return t.id !== id; });
    commitBoard();
  }

  function addSection(){
    var sec = {
      id: uid(),
      name: "New Section",
      color: PALETTE[state.board.sections.length % PALETTE.length]
    };
    state.board.sections.push(sec);
    state.editing = { kind: "section", id: sec.id };
    state.focus = "edit-" + sec.id;
    commitBoard();
  }

  function moveSection(id, delta){
    var list = state.board.sections;
    var i = list.findIndex(function(s){ return s.id === id; });
    var to = i + delta;
    if (i < 0 || to < 0 || to >= list.length) return;
    var tmp = list[i]; list[i] = list[to]; list[to] = tmp;
    commitBoard();
  }

  function deleteSection(id){
    var list = state.board.sections;
    if (list.length <= 1){ showToast("Keep at least one section"); return; }
    var i = list.findIndex(function(s){ return s.id === id; });
    list.splice(i, 1);
    var fallback = list[Math.max(0, i - 1)].id;
    state.board.tasks.forEach(function(t){
      if (t.sectionId === id) t.sectionId = fallback;
    });
    commitBoard();
  }

  /* ============================ rendering ============================ */
  function ageBadge(task){
    if (task.kind === "note") return "";
    var n = ageOf(task);
    if (n < 1) return "";
    var cls = n >= 7 ? "hot" : (n >= 3 ? "warm" : "");
    var title = "On the list since " + fmtShort(task.created) + " · " + plural(n, "day", "days");
    return '<span class="age ' + cls + '" title="' + esc(title) + '">' + n + 'd</span>';
  }

  function taskRow(task){
    var isNote = task.kind === "note";
    var editing = state.editing && state.editing.kind === "task" && state.editing.id === task.id;
    var menuOpen = state.menu && state.menu.kind === "task" && state.menu.id === task.id;

    var cls = "row menuwrap" +
      (isNote ? " note" : "") +
      (task.indent ? " ind" : "") +
      (task.status === "wip" ? " wip" : "") +
      (task.flag ? " today" + flagClass(task) : "") +
      (task.hi ? " hi" : "");

    var body = editing
      ? '<input class="textedit" id="edit-' + esc(task.id) + '" data-id="' + esc(task.id) +
        '" value="' + esc(task.text) + '" aria-label="Edit line">'
      : '<div class="text" data-act="edit-task" data-id="' + esc(task.id) + '">' + esc(task.text) + '</div>';

    var box = isNote
      ? '<div class="box" aria-hidden="true"></div>'
      : '<div class="box"><button data-act="complete" data-id="' + esc(task.id) +
        '" aria-label="Mark done: ' + esc(task.text) + '">' + ICON.check + '</button></div>';

    var chip = task.status === "waiting"
      ? '<span class="chip waiting">waiting</span>'
      : (task.status === "wip" ? '<span class="chip">in prog</span>' : "");

    return '' +
      '<div class="' + cls + '" data-row="' + esc(task.id) + '" draggable="' + (editing ? "false" : "true") + '">' +
        box +
        body +
        '<div class="meta">' +
          chip +
          ageBadge(task) +
          (isNote ? "" : markButtons(task)) +
          '<span class="grip" aria-hidden="true">' + ICON.grip + '</span>' +
          '<button class="dots' + (menuOpen ? " open" : "") + '" data-act="menu" data-kind="task" data-id="' + esc(task.id) + '" aria-label="Line options" aria-expanded="' + (menuOpen ? "true" : "false") + '">' + ICON.dots + '</button>' +
        '</div>' +
        (menuOpen ? taskMenu(task) : "") +
      '</div>';
  }

  function markButtons(task){
    var n = flagAge(task);
    var age = n > 0 ? " \u2014 marked " + plural(n, "day", "days") + " ago" : "";

    var star = task.hi ? "High priority \u2014 click to clear" : "Make high priority";
    var day = n < 0
      ? "Put on today's list"
      : "On today's list" + age + " \u2014 click to take off";

    return '' +
      '<button class="markbtn star' + (task.hi ? " on" : "") +
        '" data-act="prio" data-id="' + esc(task.id) + '" title="' + esc(star) +
        '" aria-pressed="' + (task.hi ? "true" : "false") + '" aria-label="' + esc(star) + '">' +
        (task.hi ? ICON.starOn : ICON.starOff) + '</button>' +
      '<button class="markbtn' + (n < 0 ? "" : " on" + flagClass(task)) +
        '" data-act="flag" data-id="' + esc(task.id) + '" title="' + esc(day) +
        '" aria-pressed="' + (n < 0 ? "false" : "true") + '" aria-label="' + esc(day) + '">' +
        (n < 0 ? ICON.flagOff : ICON.flagOn) + '</button>';
  }

  function taskMenu(task){
    if (state.confirm === task.id){
      return '<div class="menu">' +
        '<div class="lbl">Delete this task?</div>' +
        '<button class="danger" data-act="delete-task" data-id="' + esc(task.id) + '">Yes, delete it</button>' +
        '<button data-act="close-menu">Keep it</button>' +
      '</div>';
    }
    var others = state.board.sections.filter(function(s){ return s.id !== task.sectionId; });
    var moves = others.map(function(s){
      return '<button data-act="retarget" data-id="' + esc(task.id) + '" data-section="' + esc(s.id) + '">' +
        '<span class="swatch" style="background:' + esc(s.color) + '"></span>' + esc(s.name) + '</button>';
    }).join("");
    var isNote = task.kind === "note";
    var statusRow = isNote ? "" : (
      '<button data-act="status" data-id="' + esc(task.id) + '" data-status="' + (task.status === "wip" ? "" : "wip") + '">' +
        (task.status === "wip" ? "Clear \u201Cin prog\u201D" : "Mark in prog") + '</button>' +

  function sectionBlock(sec, focus){
    var all = tasksOf(sec.id);
    var lines = all;
    if (focus){
      lines = all.filter(function(t){ return !!t.flag; })
                 .sort(function(a, b){ return (b.hi ? 1 : 0) - (a.hi ? 1 : 0); });
    }
    var work = all.filter(function(t){ return t.kind !== "note"; });
    var flagged = work.filter(function(t){ return !!t.flag; });
    var done = doneOf(sec.id);
    var closed = !!sec.collapsed;
    var editing = state.editing && state.editing.kind === "section" && state.editing.id === sec.id;
    var menuOpen = state.menu && state.menu.kind === "section" && state.menu.id === sec.id;

    var label = editing
      ? '<input class="secedit" id="edit-' + esc(sec.id) + '" data-id="' + esc(sec.id) +
        '" value="' + esc(sec.name) + '" aria-label="Section name">'
      : '<div class="secname" data-act="edit-section" data-id="' + esc(sec.id) + '">' + esc(sec.name) + '</div>';

    var count = focus
      ? (lines.length + " for today" + (done.length ? " \u00B7 " + done.length + " done" : ""))
      : ((flagged.length ? flagged.length + " today \u00B7 " : "") +
         (work.length ? work.length + " open" : "clear") +
         (done.length ? " \u00B7 " + done.length + " done" : ""));

    var body = closed ? "" :
      '<div class="rows" data-section="' + esc(sec.id) + '">' +
        lines.map(taskRow).join("") +
        (!lines.length && !done.length ? '<div class="empty">Nothing here yet.</div>' : "") +
        (done.length ? '<div class="donehead">Done today</div>' + done.map(doneRow).join("") : "") +
      '</div>' +

        '<div class="addline">' +
          '<span class="addplus" aria-hidden="true">+</span>' +
          '<input id="add-' + esc(sec.id) + '" data-section="' + esc(sec.id) + '" placeholder="Add a task\u2026" aria-label="Add a task to ' + esc(sec.name) + '" autocomplete="off">' +
        '</div>');

    return '<div class="section' + (closed ? " closed" : "") + '">' +
      '<div class="sechead menuwrap">' +
        '<button class="sectoggle" data-act="toggle-section" data-id="' + esc(sec.id) + '" aria-expanded="' + (closed ? "false" : "true") + '" aria-label="' + (closed ? "Expand" : "Collapse") + ' ' + esc(sec.name) + '">' + ICON.caret + '</button>' +
        '<span class="dot" style="background:' + esc(sec.color) + '"></span>' +
        label +
        '<span class="seccount">' + esc(count) + '</span>' +
        '<button class="dots' + (menuOpen ? " open" : "") + '" data-act="menu" data-kind="section" data-id="' + esc(sec.id) + '" aria-label="Section options" aria-expanded="' + (menuOpen ? "true" : "false") + '">' + ICON.dots + '</button>' +
        (menuOpen ? sectionMenu(sec) : "") +

  /* Three columns on a laptop or a tablet held sideways, two at middling
     widths, one on a phone held upright. */
  function columnCount(){
    var w = window.innerWidth || 1024;
    return w >= 1150 ? 3 : (w >= 780 ? 2 : 1);
  }

  function sectionWeight(sec, focus){
    if (sec.collapsed) return 2;
    var lines = tasksOf(sec.id);
    if (focus) lines = lines.filter(function(t){ return !!t.flag; });
    return 3 + lines.length + doneOf(sec.id).length;
  }

  /* Place the longest sections first, each into whichever column is
     currently shortest - placing in source order lets one long section land
     last and leave every other column short. Each column is then put back
     into the sheet's own order, so the arrangement still reads as yours. */
  function distribute(secs, n, focus){
    var cols = [], load = [], i;
    for (i = 0; i < n; i++){ cols.push([]); load.push(0); }

    var rank = {};
    secs.forEach(function(sec, idx){ rank[sec.id] = idx; });

    secs.slice()
      .sort(function(a, b){ return sectionWeight(b, focus) - sectionWeight(a, focus); })
      .forEach(function(sec){
        var k = 0;
        for (var j = 1; j < n; j++) if (load[j] < load[k]) k = j;
        cols[k].push(sec);
        load[k] += sectionWeight(sec, focus);
      });

    cols.forEach(function(col){
      col.sort(function(a, b){ return rank[a.id] - rank[b.id]; });
    });
    return cols;
  }

  function sheetView(focus){
    var secs = state.board.sections;
    var strays = [];

    if (focus){
      strays = state.board.tasks.filter(function(t){
        return t.hi && !t.flag && t.kind !== "note";
      });
      secs = secs.filter(function(sec){
        return doneOf(sec.id).length ||
               tasksOf(sec.id).some(function(t){ return !!t.flag; });
      });
      if (!secs.length && !strays.length){
        return '<div class="blank">Nothing on today\u2019s list yet.<br>' +
          'On the All tab, click the \u25B8 beside anything you mean to get ' +
          'done today \u2014 or start a new line with !</div>';
      }
    }

    var cols = distribute(secs, columnCount(), focus);

    var stray = strays.length
      ? '<div class="section strays">' +
          '<div class="strayhead">High priority, not on today\u2019s list</div>' +
          '<div class="rows">' + strays.map(taskRow).join("") + '</div>' +
        '</div>'
      : "";

    var body = cols.map(function(col, i){
      return '<div class="col">' +
        col.map(function(sec){ return sectionBlock(sec, focus); }).join("") +
        (i === cols.length - 1 ? stray : "") +
      '</div>';
    }).join("");

    return '<div class="sheet' + (focus ? " focus" : "") + '">' + body + '</div>' +
      (focus ? "" :
        '<button class="addsec" data-act="add-section"><span aria-hidden="true">+</span> Add a section</button>');
  }

  function parseSheet(text){
    var out = [], cur = null;
    String(text).split(/\r?\n/).forEach(function(raw){
      if (!raw.trim()) return;
      if (/^\s*#/.test(raw)){
        var name = raw.replace(/^\s*#+\s*/, "").trim();
        if (name){ cur = { name: name, lines: [] }; out.push(cur); }
        return;
      }
      if (!cur){ cur = { name: "Unfiled", lines: [] }; out.push(cur); }
      var line = parseLine(raw);
      if (line.text) cur.lines.push(line);
    });
    return out.filter(function(sec){ return sec.lines.length || sec.name; });
  }

  function applyImport(parsed, replace){
    if (!parsed.length){ showToast("Nothing to import \u2014 add a # heading first"); return; }
    var b = state.board;
    if (replace){ b.sections = []; b.tasks = []; }
    var fresh = [];

    parsed.forEach(function(ps){
      var sec = b.sections.find(function(x){
        return x.name.toLowerCase() === ps.name.toLowerCase();
      });
      if (!sec){
        sec = {
          id: uid(), name: ps.name,
          color: PALETTE[b.sections.length % PALETTE.length], collapsed: false
        };
        b.sections.push(sec);
      }
      ps.lines.forEach(function(line){
        if (line.done && line.kind === "task"){
          fresh.push({
            id: uid(), text: line.text, sectionId: sec.id, sectionName: sec.name,
            color: sec.color, created: state.today, doneAt: Date.now(), age: 0
          });
        } else {
          b.tasks.push({
            id: uid(), sectionId: sec.id, text: line.text, created: state.today,
            kind: line.kind, status: line.status, indent: line.indent,
            flag: line.flag ? state.today : "",
            hi: !!line.hi
          });
        }
      });
    });

    state.panel = null;
    state.confirm = null;
    if (fresh.length){
      var day = state.day || { date: state.today, items: [] };
      commitDay({ date: state.today, items: fresh.concat(day.items) });
    }
    commitBoard();
    showToast("Imported " + plural(parsed.length, "section", "sections"));
  }

  /* ---- dictation -------------------------------------------------- */
  /* The page cannot reach a microphone from inside the viewer frame, so the
     device's own dictation fills the box and Claude only does the sorting. */

  var SAMPLE_ERRORS = {
    not_granted: "You declined Claude access for this page. Reload to be asked again.",
    sampling_disabled: "Claude isn't available on this account.",
    rate_limited: "Too many requests just now \u2014 give it a minute and try again.",
    session_expired: "Your session expired. Sign in again, then retry.",
    prompt_too_large: "That's too long to sort in one go \u2014 split it in half.",
    invalid_json: "Claude's reply came back garbled. Try again.",
    empty_completion: "Claude returned nothing. Try rewording it.",
    refused: "Claude declined to sort that text.",
    cancelled: ""
  };

  function dictPrompt(text){
    var names = state.board.sections.map(function(x){ return "- " + x.name; }).join("\n");
    return [
      "Sort a spoken brain-dump into a daily task sheet.",
      "",
      "The sheet already has these sections:",
      names,
      "",
      "What was dictated (speech-to-text, so expect run-on sentences and",
      "mis-heard words \u2014 keep the speaker's own shorthand and abbreviations):",
      '"""',
      text.slice(0, 12000),
      '"""',
      "",
      "Reply with only a JSON array, one object per distinct task:",
      '{"section": string, "text": string, "today": boolean, "high": boolean, "status": ""|"wip"|"waiting"}',
      "",
      "Rules:",
      "- section: one of the names above when it plainly fits; otherwise a new short name.",
      "- text: the task itself, short and imperative. Do not invent tasks, and do not",
      "  expand abbreviations or acronyms the speaker used.",
      "- today: true only if they said it is for today, this morning, now, or similar.",
      "- high: true only if they called it urgent, high priority, critical, or similar.",
      "- status: \"wip\" if already under way, \"waiting\" if blocked on another person,",
      "  otherwise an empty string.",
      "- Asides that are not tasks are left out."
    ].join("\n");
  }

  function runDictation(){
    var text = (state.dictText || "").trim();
    if (!text){ showToast("Nothing to sort yet"); return; }
    if (!state.sampler) return;

    state.dictBusy = true;
    state.dictError = "";
    state.dictResult = null;
    state.dictAbort = new AbortController();
    render();

    state.sampler.json(dictPrompt(text), {
      modelTier: "default",
      cache: false,
      signal: state.dictAbort.signal
    })
      .then(function(items){
        state.dictBusy = false;
        if (!Array.isArray(items) || !items.length){
          state.dictError = "Claude didn't find any tasks in that.";
        } else {
          state.dictResult = items.filter(function(it){
            return it && String(it.text || "").trim();
          });
        }
        render();
      })
      .catch(function(e){
        state.dictBusy = false;
        var code = (e && e.code) || "upstream_error";
        state.dictError = SAMPLE_ERRORS[code] ||
          "That didn't go through \u2014 try again in a moment.";
        render();
      });
  }

  function applyParsed(items){
    var b = state.board;
    var added = 0;

    items.forEach(function(it){
      var name = String(it.section || "").trim() || "Unfiled";
      var sec = b.sections.find(function(x){
        return x.name.toLowerCase() === name.toLowerCase();
      });
      if (!sec){
        sec = {
          id: uid(), name: name,
          color: PALETTE[b.sections.length % PALETTE.length], collapsed: false
        };
        b.sections.push(sec);
      }
      var text = String(it.text || "").trim();
      if (!text) return;
      var status = (it.status === "wip" || it.status === "waiting") ? it.status : "";
      b.tasks.push({
        id: uid(), sectionId: sec.id, text: text, created: state.today,
        kind: "task", status: status, indent: 0,
        flag: it.today ? state.today : "",
        hi: !!it.high
      });
      added++;
    });

    state.panel = null;
    state.dictResult = null;
    state.dictText = "";
    commitBoard();
    showToast("Added " + plural(added, "task", "tasks"));
  }

  function reviewList(items){
    var groups = [];
    items.forEach(function(it){
      var name = String(it.section || "Unfiled").trim() || "Unfiled";
      var g = groups.find(function(x){ return x.name === name; });
      if (!g){ g = { name: name, items: [] }; groups.push(g); }
      g.items.push(it);

    return '<div class="review">' + groups.map(function(g){
      var isNew = !state.board.sections.some(function(x){

  function importPanel(){

      '<p class="hint caution">What follows is a rough read of your paper sheet \u2014 ' +
      'check the wording before you import it.</p>' +
      '<textarea class="copybox" id="importbox" spellcheck="false" aria-label="Sheet to import"></textarea>' +
      '<div class="prow">' +
        '<button class="btn" data-act="do-import" data-mode="append">Add to my sheet</button>' +
        '<button class="btn" data-act="do-import" data-mode="replace">' +
          (arming ? "Yes \u2014 wipe and replace" : "Replace everything") + '</button>' +
        '<button class="btn" data-act="close-panel">Cancel</button>' +
      '</div>' +
    '</div>';
  }

  function settingsPanel(){
    var s = state.board.settings || { dayStart: 4 };
    var hours = [0,1,2,3,4,5,6,7,8].map(function(h){
      var lbl = h === 0 ? "Midnight" : (h < 12 ? h + ":00 AM" : h + ":00");
      return '<option value="' + h + '"' + (h === s.dayStart ? " selected" : "") + '>' + esc(lbl) + '</option>';
    }).join("");
    return '<div class="panel">' +
      '<h2>Settings</h2>' +
      '<div class="field">' +
        '<div><div class="k">A new day starts at</div>' +
        '<div class="h">Work past midnight still counts as the day before.</div></div>' +
        '<select id="daystart" data-act="daystart" aria-label="Hour a new day starts">' + hours + '</select>' +
      '</div>' +
      '<div class="field">' +
        '<div><div class="k">Where this is stored</div>' +
        '<div class="h">' + (store.kind === "cloud"
            ? "Synced to your Claude account — same sheet on every device."
            : "This browser only. Open the published link to sync across devices.") + '</div></div>' +
        '<span class="val">' + (store.kind === "cloud" ? "Synced" : "This device") + '</span>' +
      '</div>' +
      '<div class="field">' +
        '<div><div class="k">Dictate a list</div>' +
        '<div class="h">' + (state.sampler
          ? "Talk it through and Claude sorts it into your sections. The only part of this app that uses Claude."
          : "Not available in this view \u2014 open the published link while signed in.") + '</div></div>' +
        (state.sampler ? '<button class="btn" data-act="dictate">Dictate\u2026</button>' : '<span class="val">off</span>') +
      '</div>' +
      '<div class="field">' +
        '<div><div class="k">Import a sheet</div>' +
        '<div class="h">Paste a whole list in at once instead of typing it.</div></div>' +
        '<button class="btn" data-act="open-import">Import\u2026</button>' +
      '</div>' +
      '<div class="field">' +
        '<div><div class="k">Export the log</div>' +
        '<div class="h">Everything finished, newest first, as plain text.</div></div>' +
        '<button class="btn" data-act="export-log">Copy log</button>' +
      '</div>' +
    '</div>';
  }

  function copyPanel(){
    return '<div class="panel">' +
      '<h2>Copy — select the text below</h2>' +
      '<textarea class="copybox" id="copybox" readonly>' + esc(state.copyText) + '</textarea>' +
      '<div style="margin-top:10px"><button class="btn" data-act="close-panel">Done</button></div>' +
    '</div>';
  }

  function render(){
    if (!state.board){
      document.getElementById("main").innerHTML = '<div class="blank">Opening your sheet…</div>';
      return;
    }
    var c = counts();
    document.getElementById("dateline").textContent = fmtLong(state.today);
    document.getElementById("tally").innerHTML =
      (c.high ? '<span class="hot"><b>' + c.high + '</b> high</span>' : "") +
      '<span><b>' + c.flagged + '</b> for today</span>' +
      '<span><b>' + c.done + '</b> done</span>' +
      (c.wip ? '<span><b>' + c.wip + '</b> in prog</span>' : "") +
      '<span><b>' + c.open + '</b> on the list</span>' +
      (c.carried ? '<span class="' + (c.stale ? "warn" : "") + '"><b>' + c.carried + '</b> carried over</span>' : "");

    ["all", "today", "log"].forEach(function(v){
      document.getElementById("tab-" + v)
        .setAttribute("aria-selected", state.view === v ? "true" : "false");
    });

    var html = state.view === "log" ? logView() : sheetView(state.view === "today");
    if (state.panel === "settings") html += settingsPanel();
    if (state.panel === "copy") html += copyPanel();
    if (state.panel === "import") html += importPanel();
    if (state.panel === "dictate") html += dictatePanel();
    document.getElementById("main").innerHTML = html;

    // restore the drafts a re-render would otherwise wipe
    state.board.sections.forEach(function(sec){
      var el = document.getElementById("add-" + sec.id);
      if (el) el.value = state.drafts[sec.id] || "";
    });

    var ib = document.getElementById("importbox");
    if (ib) ib.value = state.importText;

    var db = document.getElementById("dictbox");
    if (db) db.value = state.dictText;

    var dbtn = document.getElementById("btn-dictate");
    if (dbtn) dbtn.hidden = !state.sampler;

    if (!state.focus && state.editing) state.focus = "edit-" + state.editing.id;
    if (state.focus){
      var f = document.getElementById(state.focus);
      state.focus = null;
      if (f){
        f.focus();
        if (f.setSelectionRange && f.value) {
          try { f.setSelectionRange(f.value.length, f.value.length); } catch(e){}
        }
      }
    }
  }

  var toastTimer = null;
  function showToast(msg){
    var el = document.getElementById("toast");
    if (!el){
      el = document.createElement("div");
      el.className = "toast"; el.id = "toast"; el.setAttribute("role","status");
      document.body.appendChild(el);
    }
    el.textContent = msg;
    el.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ el.hidden = true; }, 2600);
  }

  /* ============================ text export ============================ */
  function todayAsText(){
    var lines = ["Daily Sheet — " + fmtLong(state.today), ""];
    state.board.sections.forEach(function(sec){
      var open = tasksOf(sec.id), done = doneOf(sec.id);
      if (!open.length && !done.length) return;
      lines.push(sec.name.toUpperCase());
      open.forEach(function(t){
        var tab = t.indent ? "    " : "  ";
        if (t.kind === "note"){ lines.push(tab + "  - " + t.text); return; }
        var n = ageOf(t);
        lines.push(
          tab + (t.hi ? "\u2605" : " ") + (t.flag ? "\u25B8" : " ") + " " +
          (t.status === "wip" ? "[/] " : "[ ] ") + t.text +
          (t.status === "waiting" ? "   (waiting)" : "") +
          (n ? "   (" + n + "d)" : "")
        );
      });
      done.forEach(function(d){ lines.push("    [x] " + d.text); });
      lines.push("");
    });
    var c = counts();
    lines.push("— " + c.flagged + " for today, " + c.done + " done, " +
               c.open + " on the list, " + c.carried + " carried over");
    return lines.join("\n");
  }

  function logAsText(days){
    var lines = ["Daily Sheet — completed log", ""];
    days.forEach(function(day){
      if (!day || !day.items || !day.items.length) return;
      lines.push(fmtLong(day.date) + "  (" + day.items.length + ")");
      day.items.forEach(function(it){
        lines.push("  × [" + it.sectionName + "] " + it.text + (it.age ? "   carried " + it.age + "d" : ""));
      });
      lines.push("");
    });
    return lines.join("\n");
  }

  function copyText(text){
    state.copyText = text;
    var done = function(){ showToast("Copied"); };
    var fallback = function(){ state.panel = "copy"; render(); };
    if (navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(done, fallback);
    } else {
      fallback();
    }
  }

  /* ============================ events ============================ */
  function closeTransient(){
    state.menu = null;
    state.confirm = null;
  }

  document.addEventListener("click", function(e){
    var el = e.target && e.target.closest ? e.target.closest("[data-act]") : null;
    if (!el){
      if (state.menu || state.confirm){ closeTransient(); render(); }
      return;
    }
    var act = el.getAttribute("data-act");
    var id = el.getAttribute("data-id");

    switch (act){
      case "view":
        state.view = el.getAttribute("data-view");
        state.panel = null;
        closeTransient();
        if (state.view === "log") loadLog();
        render();
        break;

      case "settings":
        state.panel = state.panel === "settings" ? null : "settings";
        closeTransient(); render();
        break;

      case "close-panel":
        state.panel = null; render();
        break;

      case "print":
        window.print();
        break;

      case "copy":
        copyText(todayAsText());
        break;

      case "export-log":
        store.listDays(400).then(function(days){ copyText(logAsText(days)); });
        break;

      case "complete":
        closeTransient(); completeTask(id);
        break;

      case "reopen":
        closeTransient(); reopenTask(id);
        break;

      case "menu": {
        var kind = el.getAttribute("data-kind");
        var same = state.menu && state.menu.id === id;
        state.confirm = null;
        state.menu = same ? null : { kind: kind, id: id };
        render();
        break;
      }

      case "close-menu":
        closeTransient(); render();
        break;

      case "edit-task":
        closeTransient();
        state.editing = { kind: "task", id: id };
        state.focus = "edit-" + id;
        render();
        break;

      case "edit-section":
        closeTransient();
        state.editing = { kind: "section", id: id };
        state.focus = "edit-" + id;
        render();
        break;

      case "move-task":
        closeTransient(); moveTask(id, +el.getAttribute("data-delta"));
        break;

      case "flag": {
        var ft = state.board.tasks.find(function(x){ return x.id === id; });
        if (ft) ft.flag = ft.flag ? "" : state.today;
        closeTransient(); commitBoard();
        break;
      }

      case "prio": {
        var pt = state.board.tasks.find(function(x){ return x.id === id; });
        if (pt) pt.hi = !pt.hi;
        closeTransient(); commitBoard();
        break;
      }

      case "kind":
        closeTransient(); setField(id, "kind", el.getAttribute("data-kind"));
        break;

      case "indent":
        closeTransient(); setField(id, "indent", +el.getAttribute("data-indent"));
        break;

      case "status":
        closeTransient(); setField(id, "status", el.getAttribute("data-status"));
        break;

      case "toggle-section": {
        var sc = state.board.sections.find(function(x){ return x.id === id; });
        if (sc) sc.collapsed = !sc.collapsed;
        closeTransient(); commitBoard();
        break;
      }

      case "dictate":
        state.panel = state.panel === "dictate" ? null : "dictate";
        closeTransient(); render();
        break;

      case "dict-run":
        runDictation();
        break;

      case "dict-stop":
        if (state.dictAbort) state.dictAbort.abort();
        state.dictBusy = false;
        render();
        break;

      case "dict-apply":
        if (state.dictResult) applyParsed(state.dictResult);
        break;

      case "dict-back":
        state.dictResult = null; render();
        break;

      case "open-import":
        state.importText = state.importText || IMPORT_SAMPLE;
        state.panel = "import";
        closeTransient(); render();
        break;

      case "do-import": {
        var replace = el.getAttribute("data-mode") === "replace";
        if (replace && state.confirm !== "import-replace"){
          state.confirm = "import-replace";
          render();
          break;
        }
        applyImport(parseSheet(state.importText), replace);
        break;
      }

      case "retarget":
        closeTransient(); retargetTask(id, el.getAttribute("data-section"));
        break;

      case "ask-delete":
        state.confirm = id; render();
        break;

      case "delete-task":
        closeTransient(); deleteTask(id);
        break;

      case "move-section":
        closeTransient(); moveSection(id, +el.getAttribute("data-delta"));
        break;

      case "delete-section":
        closeTransient(); deleteSection(id);
        break;

      case "recolor": {
        var sec = state.board.sections.find(function(s){ return s.id === id; });
        if (sec) sec.color = el.getAttribute("data-color");
        closeTransient(); commitBoard();
        break;
      }

      case "add-section":
        closeTransient(); addSection();
        break;
    }
  });

  document.addEventListener("keydown", function(e){
    var t = e.target;

    if (e.key === "Escape"){
      if (state.editing){ state.editing = null; render(); return; }
      if (state.menu || state.confirm){ closeTransient(); render(); return; }
    }

    if (e.key !== "Enter") return;

    if (t.matches && t.matches(".addline input")){
      e.preventDefault();
      addTask(t.getAttribute("data-section"), t.value);
      return;
    }
    if (t.matches && t.matches(".textedit")){
      e.preventDefault();
      saveEdit(t);
      return;
    }
    if (t.matches && t.matches(".secedit")){
      e.preventDefault();
      saveEdit(t);
    }
  });

  function saveEdit(input){
    var id = input.getAttribute("data-id");
    var value = input.value.trim();
    state.editing = null;
    if (input.classList.contains("secedit")){
      var sec = state.board.sections.find(function(s){ return s.id === id; });
      if (sec && value) sec.name = value;
      else { render(); return; }
    } else {
      var task = state.board.tasks.find(function(t){ return t.id === id; });
      if (!task){ render(); return; }
      if (!value){ deleteTask(id); return; }
      task.text = value;
    }
    commitBoard();
  }

  document.addEventListener("blur", function(e){
    var t = e.target;
    if (t && t.matches && (t.matches(".textedit") || t.matches(".secedit"))){
      if (state.editing) saveEdit(t);
    }
  }, true);

  document.addEventListener("input", function(e){
    var t = e.target;
    if (t.matches && t.matches(".addline input")){
      state.drafts[t.getAttribute("data-section")] = t.value;
    }
    if (t.id === "importbox") state.importText = t.value;
    if (t.id === "dictbox") state.dictText = t.value;
  });

  document.addEventListener("change", function(e){
    if (e.target.id === "daystart"){
      state.board.settings = state.board.settings || {};
      state.board.settings.dayStart = +e.target.value;
      checkDayRollover();
      commitBoard();
    }
  });

  /* drag to reorder (pointer devices; the ⋯ menu covers touch) */
  document.addEventListener("dragstart", function(e){
    var row = e.target.closest && e.target.closest(".row[data-row]");
    if (!row) return;
    state.dragId = row.getAttribute("data-row");
    row.classList.add("dragging");
    if (e.dataTransfer){
      e.dataTransfer.effectAllowed = "move";
      try { e.dataTransfer.setData("text/plain", state.dragId); } catch(err){}
    }
  });
  document.addEventListener("dragover", function(e){
    if (!state.dragId) return;
    var row = e.target.closest && e.target.closest(".row[data-row]");
    if (!row) return;
    e.preventDefault();
    var box = row.getBoundingClientRect();
    var after = (e.clientY - box.top) > box.height / 2;
    document.querySelectorAll(".dropbefore,.dropafter").forEach(function(n){
      n.classList.remove("dropbefore","dropafter");
    });
    row.classList.add(after ? "dropafter" : "dropbefore");
  });
  document.addEventListener("drop", function(e){
    if (!state.dragId) return;
    var row = e.target.closest && e.target.closest(".row[data-row]");
    if (!row) return;
    e.preventDefault();
    var box = row.getBoundingClientRect();
    var after = (e.clientY - box.top) > box.height / 2;
    var target = row.getAttribute("data-row");
    var drag = state.dragId;
    state.dragId = null;
    reorderTask(drag, target, after);
  });
  document.addEventListener("dragend", function(){
    state.dragId = null;
    document.querySelectorAll(".dragging,.dropbefore,.dropafter").forEach(function(n){
      n.classList.remove("dragging","dropbefore","dropafter");
    });
  });

  /* ============================ day rollover ============================ */
  function checkDayRollover(){
    var startHour = (state.board && state.board.settings && state.board.settings.dayStart) || 0;
    var key = dayKey(Date.now(), startHour);
    if (key === state.today) return false;
    state.today = key;
    state.day = null;
    if (unsubDay) { unsubDay(); unsubDay = null; }
    unsubDay = store.watchDay(state.today, function(d){
      state.day = d ? clone(d) : null;
      render();
    });
    return true;
  }

  function loadLog(){
    state.logDays = null;
    store.listDays(90).then(function(days){
      state.logDays = days;
      render();
    });
  }

  /* ============================ boot ============================ */
  function start(db){
    store = db ? cloudStore(db) : localStore();

    if (window.claude && window.claude.use){
      window.claude.use("sample").then(function(fn){
        state.sampler = (fn && typeof fn.json === "function") ? fn : null;
        render();
      }, function(){});
    }

    store.watchBoard(function(board){
      if (!board){
        if (state.board) return;            // an empty snapshot after a local edit
        state.board = seedBoard();
        store.saveBoard(state.board);
      } else {
        // don't let a slow echo of our own write clobber newer local edits
        if (state.board && board.updated && state.board.updated &&
            board.updated < state.board.updated) return;
        state.board = clone(board);
      }
      if (!state.board.sections.length){
        state.board.sections = seedBoard().sections;
      }
      checkDayRollover();
      render();
    });

    state.today = dayKey(Date.now(), 4);
    unsubDay = store.watchDay(state.today, function(d){
      state.day = d ? clone(d) : null;
      render();
    });

    setInterval(function(){
      if (state.board && checkDayRollover()) render();
    }, 30000);

    var lastCols = columnCount(), resizeTimer = null;
    window.addEventListener("resize", function(){
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(function(){
        var n = columnCount();
        if (n !== lastCols){ lastCols = n; render(); }
      }, 150);
    });

    render();
  }

  render();
  var use = window.claude && window.claude.use;
  if (use){
    window.claude.use("db").then(function(db){ start(db); }, function(){ start(null); });
  } else {
    start(null);
  }
})();
</script>
</body>
</html>
